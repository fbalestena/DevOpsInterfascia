name: interfascia

services:

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile

    container_name: interfascia-frontend

    restart: unless-stopped

    ports:
      - "3000:3000"

    depends_on:
      - backend


  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile

    container_name: interfascia-backend

    restart: unless-stopped

    ports:
      - "8000:80"

    depends_on:
      - db


  db:
    image: pgvector/pgvector:pg16

    container_name: interfascia-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: interfascia
      POSTGRES_USER: interfascia
      POSTGRES_PASSWORD: interfascia

    volumes:
      - postgres_data:/var/lib/postgresql/data

  sonarqube:
    image: sonarqube:community
    container_name: interfascia-sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"

volumes:
  postgres_data: